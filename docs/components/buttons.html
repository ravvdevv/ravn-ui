<section id="buttons" class="component-section">
    <h2 class="component-title">Buttons</h2>
    <p class="component-desc">High-precision action triggers with consistent internal padding and clear focus
        states.</p>
    <div class="mockup-container">
        <div class="mockup-tabs">
            <div class="mockup-tab active" onclick="showTab(this, 'btn-preview', 'btn-code')">Preview</div>
            <div class="mockup-tab" onclick="showTab(this, 'btn-code', 'btn-preview')">Source</div>
            <div class="mockup-tab" style="margin-left: auto; opacity: 0.3;" onclick="copyCode('btn-code')">Copy
            </div>
        </div>
        <div id="btn-preview" class="mockup-preview">
            <button class="btn btn-primary">Primary</button>
            <button class="btn btn-outline">Secondary</button>
            <button class="btn btn-ghost">Ghost</button>
            <button class="btn btn-primary btn-sm">Small</button>
        </div>
        <pre id="btn-code" class="mockup-code"><code>&lt;button class="btn btn-primary"&gt;Primary&lt;/button&gt;
&lt;button class="btn btn-outline"&gt;Secondary&lt;/button&gt;</code></pre>
    </div>
</section>
